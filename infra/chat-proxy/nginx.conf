worker_processes 1;
error_log /dev/stderr crit;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  # Test requests contain private identifiers; do not persist request/access logs.
  map $http_upgrade $upgrade_connection { default upgrade; '' close; }
  access_log off;
  gzip off;
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  server {
    listen 8080;
    client_max_body_size 64k;
    location = /__proxy-health { return 200 'ok'; }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_ignore_client_abort off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 5s;
    location /_next/webpack-hmr {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $upgrade_connection;
      proxy_pass http://host.docker.internal:3002;
    }
    location / { proxy_pass http://host.docker.internal:3002; }
    # Fault injection only. The normal app never exposes these paths.
    location = /__proxy-timeout/api/chat/turns {
      proxy_read_timeout 2s;
      proxy_pass http://host.docker.internal:3002/api/chat/turns;
    }
    # Negative control proves the incremental-delivery test detects buffering.
    location = /__proxy-buffered/api/chat/turns {
      proxy_buffering on;
      proxy_ignore_headers X-Accel-Buffering;
      proxy_pass http://host.docker.internal:3006/api/chat/turns;
    }
  }
}
